<div class="register-page">
  <div class="register-card">
    <div class="header">JOB SEEKER REGISTRATION</div>
    <h1>Create your account</h1>
    <p>Sign up to track applications, save jobs, and get matched with new openings on JobHub.lk.</p>

    <div class="form-group">
      <label>Email address</label>
      <input type="email" placeholder="you@email.com" [(ngModel)]="email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Create a password" [(ngModel)]="password">
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" placeholder="Confirm your password" [(ngModel)]="confirmPassword">
    </div>

    <button class="btn-create" (click)="register()">Create account</button>

    <p class="footer">Already have an account? <a routerLink="/job-seeker/login">Log in</a></p>
  </div>
</div>
