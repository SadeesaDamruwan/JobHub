<div class="min-h-screen bg-[#f8fafc] py-12 px-4 sm:px-6 flex justify-center items-center font-sans">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10">
    <p class="text-xs font-bold tracking-widest text-[#5046e5] uppercase mb-2">JOB SEEKER PORTAL</p>
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-3 leading-tight">Create your account</h1>
    <p class="text-gray-500 text-sm mb-8">Join JobHub to discover career opportunities, apply instantly, and track applications.</p>

    <!-- REGISTRATION FORM -->
    <form class="space-y-5" (ngSubmit)="register()">
      
      <!-- FULL NAME -->
      <div>
        <label for="fullName" class="block text-sm font-semibold text-gray-900 mb-2">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          placeholder="John Doe" 
          [(ngModel)]="fullName" 
          required 
          class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
      </div>

      <!-- EMAIL -->
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-900 mb-2">Email address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="seeker@email.com" 
          [(ngModel)]="email" 
          required 
          class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
      </div>

      <!-- PASSWORD -->
      <div>
        <label for="password" class="block text-sm font-semibold text-gray-900 mb-2">Password</label>
        <div class="relative">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password" 
            placeholder="Create a password" 
            [(ngModel)]="password" 
            required
            class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all pr-16">
          <button 
            type="button" 
            class="absolute inset-y-0 right-0 px-4 text-sm font-medium text-gray-500 hover:text-[#5046e5] transition-colors" 
            (click)="togglePassword()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div>
        <label for="confirmPassword" class="block text-sm font-semibold text-gray-900 mb-2">Confirm Password</label>
        <div class="relative">
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            id="confirmPassword" 
            name="confirmPassword" 
            placeholder="Confirm your password" 
            [(ngModel)]="confirmPassword" 
            required 
            class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all pr-16">
          <button 
            type="button" 
            class="absolute inset-y-0 right-0 px-4 text-sm font-medium text-gray-500 hover:text-[#5046e5] transition-colors" 
            (click)="toggleConfirmPassword()">
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <!-- SUBMIT BUTTON -->
      <button type="submit" class="w-full bg-[#5046e5] text-white font-medium py-3.5 rounded-xl hover:bg-[#4338ca] transition-colors mt-6 shadow-sm disabled:opacity-60 disabled:cursor-not-allowed" [disabled]="isLoading">
        {{ isLoading ? 'Creating account...' : 'Sign up' }}
      </button>

      <!-- MESSAGE ALERTS -->
      @if (message) {
        <p class="text-sm font-medium text-center p-3 rounded-lg mt-4" [ngClass]="success ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'">
          {{ message }}
        </p>
      }
    </form>

    <!-- LOGIN LINK -->
    <p class="text-center text-sm text-gray-600 mt-8">
      Already have an account? <a routerLink="/job-seeker/login" class="font-medium text-[#5046e5] hover:underline">Log in</a>
    </p>
  </div>
</div>
