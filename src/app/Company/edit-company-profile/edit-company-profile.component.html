<div class="min-h-screen bg-[#f8fafc] py-12 px-4 sm:px-6 flex justify-center items-start font-sans">
  <div class="bg-white w-full max-w-3xl rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10 mt-4">
    
    <!-- PAGE HEADER -->
    <div class="flex items-center justify-between border-b border-gray-100 pb-6 mb-8">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">Company Profile</h1>
        <p class="text-sm text-gray-500 mt-1">Update your company details and public profile information.</p>
      </div>
      <a routerLink="/" class="text-sm font-medium text-[#5046e5] hover:text-[#4338ca] transition-colors bg-gray-50 px-5 py-2.5 rounded-lg border border-gray-200 shadow-sm">
        ← Back to Home
      </a>
    </div>

    <!-- PROFILE FORM -->
    <form (ngSubmit)="saveProfile()" class="space-y-6">
      
      <!-- COMPANY LOGO -->
      <div class="flex items-center space-x-6 mb-8 bg-gray-50 p-6 rounded-xl border border-gray-100">
        <div class="flex-shrink-0 w-20 h-20 bg-white border border-gray-200 rounded-xl flex items-center justify-center overflow-hidden shadow-sm">
          @if (logoPreview) {
            <img [src]="logoPreview" alt="Company logo" class="w-full h-full object-cover">
          } @else {
            <span class="text-2xl font-bold text-[#f5a623]">TS</span>
          }
        </div>
        <div>
          <h3 class="text-sm font-bold text-gray-900 mb-2">Company Logo</h3>
          <input type="file" id="logoInput" accept="image/png, image/jpeg" class="hidden" (change)="onLogoSelected($event)">
          <label for="logoInput" class="inline-block px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-[#5046e5] cursor-pointer transition-colors shadow-sm">Change Logo</label>
          <p class="text-xs text-gray-400 mt-2">Recommended: Square JPG or PNG, max 2MB.</p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- COMPANY NAME -->
        <div>
          <label for="companyName" class="block text-sm font-semibold text-gray-900 mb-2">Company Name *</label>
          <input type="text" id="companyName" name="companyName" [(ngModel)]="companyName" required class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
        </div>

        <!-- EMAIL -->
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-900 mb-2">Contact Email *</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
        </div>

        <!-- WEBSITE -->
        <div>
          <label for="website" class="block text-sm font-semibold text-gray-900 mb-2">Website</label>
          <input type="url" id="website" name="website" placeholder="https://" [(ngModel)]="website" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
        </div>

        <!-- INDUSTRY -->
        <div>
          <label for="industry" class="block text-sm font-semibold text-gray-900 mb-2">Industry</label>
          <div class="relative">
            <select id="industry" name="industry" [(ngModel)]="industry" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all appearance-none cursor-pointer pr-10">
              <option *ngFor="let ind of industries" [value]="ind">{{ ind }}</option>
            </select>
            <span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none text-xs">▼</span>
          </div>
        </div>

        <!-- LOCATION -->
        <div class="md:col-span-2">
          <label for="location" class="block text-sm font-semibold text-gray-900 mb-2">Headquarters / Location</label>
          <input type="text" id="location" name="location" [(ngModel)]="location" placeholder="e.g. Colombo 03, Sri Lanka" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
        </div>

        <!-- DESCRIPTION -->
        <div class="md:col-span-2">
          <label for="description" class="block text-sm font-semibold text-gray-900 mb-2">Company Description</label>
          <textarea id="description" name="description" rows="4" [(ngModel)]="description" placeholder="Tell candidates about your company's mission and culture..." class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all resize-y"></textarea>
        </div>
      </div>

      <!-- SAVE BUTTON -->
      <div class="pt-6 border-t border-gray-100 flex items-center justify-end">
        <button type="submit" class="bg-[#5046e5] text-white font-medium px-8 py-3 rounded-xl hover:bg-[#4338ca] transition-colors shadow-sm">Save Changes</button>
      </div>

      <!-- SUCCESS MESSAGE -->
      @if (message) {
        <p class="text-sm font-medium text-center p-3 rounded-lg mt-4 transition-all" 
           [ngClass]="isSuccess ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'">
          {{ message }}
        </p>
      }

    </form>
  </div>
</div>
