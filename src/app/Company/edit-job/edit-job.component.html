<div class="min-h-screen bg-[#f8fafc] py-12 px-4 sm:px-6 flex justify-center items-start font-sans">
  <div class="bg-white w-full max-w-3xl rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10 mt-8">
    
    <div class="flex justify-between items-start mb-8">
      <div>
        <p class="text-xs font-bold tracking-widest text-[#5046e5] uppercase mb-2">EMPLOYER DASHBOARD</p>
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2 leading-tight">Edit job post</h1>
        <p class="text-gray-500 text-sm">Update the details of your active job listing below.</p>
      </div>
      <a routerLink="/company/settings" class="text-sm font-medium text-gray-400 hover:text-gray-700 transition-colors">✕ Cancel</a>
    </div>

    <form (ngSubmit)="updateJob()" class="space-y-6">
      
      <div>
        <label for="jobTitle" class="block text-sm font-semibold text-gray-900 mb-2">Job Title *</label>
        <input type="text" id="jobTitle" name="jobTitle" [(ngModel)]="jobTitle" required class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="category" class="block text-sm font-semibold text-gray-900 mb-2">Category</label>
          <div class="relative">
            <select id="category" name="category" [(ngModel)]="category" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all appearance-none cursor-pointer pr-10">
              <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
            </select>
            <span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none text-xs">▼</span>
          </div>
        </div>

        <div>
          <label for="jobLevel" class="block text-sm font-semibold text-gray-900 mb-2">Job Level</label>
          <div class="relative">
            <select id="jobLevel" name="jobLevel" [(ngModel)]="jobLevel" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all appearance-none cursor-pointer pr-10">
              <option *ngFor="let level of jobLevels" [value]="level">{{ level }}</option>
            </select>
            <span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none text-xs">▼</span>
          </div>
        </div>

        <div>
          <label for="workMode" class="block text-sm font-semibold text-gray-900 mb-2">Work Mode</label>
          <div class="relative">
            <select id="workMode" name="workMode" [(ngModel)]="workMode" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all appearance-none cursor-pointer pr-10">
              <option *ngFor="let mode of workModes" [value]="mode">{{ mode }}</option>
            </select>
            <span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none text-xs">▼</span>
          </div>
        </div>

        <div>
          <label for="location" class="block text-sm font-semibold text-gray-900 mb-2">Location *</label>
          <input type="text" id="location" name="location" [(ngModel)]="location" required class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
        </div>

        <div>
          <label for="stipend" class="block text-sm font-semibold text-gray-900 mb-2">Salary / Stipend</label>
          <input type="text" id="stipend" name="stipend" [(ngModel)]="stipend" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
        </div>

        <div>
          <label for="deadline" class="block text-sm font-semibold text-gray-900 mb-2">Application Deadline</label>
          <input type="date" id="deadline" name="deadline" [(ngModel)]="deadline" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all text-gray-500">
        </div>

      </div>

      <div>
        <label for="description" class="block text-sm font-semibold text-gray-900 mb-2">Job Description *</label>
        <textarea id="description" name="description" rows="5" [(ngModel)]="description" required class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all resize-y"></textarea>
      </div>

      <div class="pt-4 border-t border-gray-100 flex items-center justify-end gap-4 mt-8">
        <a routerLink="/company/settings" class="px-6 py-3 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors cursor-pointer">Cancel</a>
        <button type="submit" class="bg-[#5046e5] text-white font-medium px-8 py-3 rounded-xl hover:bg-[#4338ca] transition-colors shadow-sm">Save Changes</button>
      </div>

      @if (message) {
        <p class="text-sm font-medium text-center p-3 rounded-lg mt-4" [ngClass]="isSuccess ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'">{{ message }}</p>
      }
    </form>

  </div>
</div>
