<div class="min-h-screen bg-[#f8fafc] py-12 px-4 sm:px-6 flex justify-center items-center font-sans">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10">
    <p class="text-xs font-bold tracking-widest text-[#5046e5] uppercase mb-2">COMPANY REGISTRATION</p>
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-3 leading-tight">Create your company<br>account</h1>
    <p class="text-gray-500 text-sm mb-8">Set up your employer profile to post jobs, manage applicants, and hire on JobHub.lk.</p>

    <!-- COMPANY LOGO -->
    <div class="flex items-center space-x-5 mb-8">
      <div class="flex-shrink-0 w-16 h-16 bg-[#f8fafc] border border-gray-200 rounded-xl flex items-center justify-center overflow-hidden">
        @if (logoPreview) {
          <img [src]="logoPreview" alt="Company logo" class="w-full h-full object-cover">
        } @else {
          <span class="text-xs font-semibold text-gray-400">LOGO</span>
        }
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-900 mb-1">Company logo</label>
        <input type="file" id="logoInput" accept="image/png, image/jpeg" class="hidden" (change)="onLogoSelected($event)">
        <label for="logoInput" class="inline-block px-3 py-1.5 border border-gray-200 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 cursor-pointer transition-colors mb-1">⬆ Upload logo</label>
        <p class="text-xs text-gray-400">PNG or JPG, square image recommended</p>
      </div>
    </div>

    <!-- REGISTRATION FORM -->
    <form class="space-y-5" (ngSubmit)="createAccount()">
      <!-- COMPANY NAME -->
      <div>
        <label for="companyName" class="block text-sm font-semibold text-gray-900 mb-2">Company Name</label>
        <input type="text" id="companyName" name="companyName" placeholder="e.g. Technova Solutions" [(ngModel)]="companyName" required class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
      </div>

      <!-- EMAIL -->
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-900 mb-2">Company email address</label>
        <input type="email" id="email" name="email" placeholder="company@email.com" [(ngModel)]="email" required class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
      </div>

      <!-- PASSWORD -->
      <div>
        <label for="password" class="block text-sm font-semibold text-gray-900 mb-2">Password</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" placeholder="Enter your password" [(ngModel)]="password" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all pr-16">
          <button type="button" class="absolute inset-y-0 right-0 px-4 text-sm font-medium text-gray-500 hover:text-[#5046e5] transition-colors" (click)="togglePassword()">{{ showPassword ? 'Hide' : 'Show' }}</button>
        </div>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div>
        <label for="confirmPassword" class="block text-sm font-semibold text-gray-900 mb-2">Confirm password</label>
        <div class="relative">
          <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" [(ngModel)]="confirmPassword" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all pr-16">
          <button type="button" class="absolute inset-y-0 right-0 px-4 text-sm font-medium text-gray-500 hover:text-[#5046e5] transition-colors" (click)="toggleConfirmPassword()">{{ showConfirmPassword ? 'Hide' : 'Show' }}</button>
        </div>
      </div>

      <!-- REMEMBER / FORGOT -->
      <div class="flex items-center justify-between mt-6">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" class="w-4 h-4 text-[#5046e5] border-gray-300 rounded focus:ring-[#5046e5]">
          <span class="ml-2 text-sm text-gray-600">Remember me</span>
        </label>
        <a routerLink="/company/login" [queryParams]="{ forgot: 'true' }" class="text-sm font-medium text-[#5046e5] hover:underline cursor-pointer">Forgot password?</a>
      </div>

      <!-- CREATE BUTTON -->
      <button type="submit" class="w-full bg-[#5046e5] text-white font-medium py-3.5 rounded-xl hover:bg-[#4338ca] transition-colors mt-6 shadow-sm">Create company account</button>

      <!-- MESSAGE -->
      @if (message) {
        <p class="text-sm font-medium text-center p-3 rounded-lg mt-4" [ngClass]="success ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'">{{ message }}</p>
      }
    </form>

    <!-- LOGIN -->
    <p class="text-center text-sm text-gray-600 mt-8">
      Already registered? <a routerLink="/company/login" class="font-medium text-[#5046e5] hover:underline">Log in instead</a>
    </p>
  </div>
</div>
