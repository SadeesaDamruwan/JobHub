<div class="min-h-screen bg-[#f8fafc] py-12 px-4 sm:px-6 flex justify-center font-sans">
  <div class="bg-white w-full max-w-3xl rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10 relative">
    
    <!-- HEADER -->
    <div class="flex justify-between items-start mb-8">
      <div>
        <p class="text-xs font-bold tracking-widest text-[#5046e5] uppercase mb-2">EMPLOYER DASHBOARD</p>
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2 leading-tight">Create job post</h1>
        <p class="text-gray-500 text-sm">Enter the details of your new job listing below.</p>
      </div>
      <button type="button" (click)="cancel()" class="text-gray-400 hover:text-gray-600 font-medium text-sm flex items-center gap-1 transition-colors">
        ✕ Cancel
      </button>
    </div>

    <!-- POST JOB FORM -->
    <form class="space-y-6" (ngSubmit)="submitJob()">
      
      <!-- JOB TITLE -->
      <div>
        <label for="jobTitle" class="block text-sm font-semibold text-gray-900 mb-2">Job Title *</label>
        <input type="text" id="jobTitle" name="jobTitle" [(ngModel)]="jobTitle" required placeholder="e.g. Senior Flutter Developer" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
      </div>

      <!-- ROW 1: Category & Job Level -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="category" class="block text-sm font-semibold text-gray-900 mb-2">Category</label>
          <select id="category" name="category" [(ngModel)]="category" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all appearance-none">
            <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
          </select>
        </div>
        <div>
          <label for="jobLevel" class="block text-sm font-semibold text-gray-900 mb-2">Job Level</label>
          <select id="jobLevel" name="jobLevel" [(ngModel)]="jobLevel" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all appearance-none">
            <option *ngFor="let level of jobLevels" [value]="level">{{ level }}</option>
          </select>
        </div>
      </div>

      <!-- ROW 2: Work Mode & Location -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="workMode" class="block text-sm font-semibold text-gray-900 mb-2">Work Mode</label>
          <select id="workMode" name="workMode" [(ngModel)]="workMode" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all appearance-none">
            <option *ngFor="let mode of workModes" [value]="mode">{{ mode }}</option>
          </select>
        </div>
        <div>
          <label for="location" class="block text-sm font-semibold text-gray-900 mb-2">Location *</label>
          <input type="text" id="location" name="location" [(ngModel)]="location" required placeholder="e.g. Colombo 03" class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all">
        </div>
      </div>

      <!-- ROW 3: Stipend & Deadline -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2">Salary / Stipend</label>
          <div class="flex rounded-xl shadow-sm border border-gray-200 bg-[#f8fafc] overflow-hidden focus-within:ring-2 focus-within:ring-[#5046e5] focus-within:bg-white transition-all">
            <select name="selectedCurrency" [(ngModel)]="selectedCurrency" class="bg-gray-100/80 hover:bg-gray-100 text-gray-800 text-sm font-semibold px-3.5 py-3 border-r border-gray-200 outline-none cursor-pointer transition">
              <option value="LKR">LKR (Rs.)</option>
              <option value="USD">USD ($)</option>
            </select>
            <input type="text" id="stipend" name="stipendAmount" [(ngModel)]="stipendAmount" placeholder="e.g. 85,000" class="flex-1 px-4 py-3 bg-transparent text-gray-900 text-sm outline-none placeholder:text-gray-400">
            <span class="inline-flex items-center px-3.5 text-gray-400 text-xs font-semibold uppercase tracking-wider border-l border-gray-200 bg-gray-50 select-none">
              / mo
            </span>
          </div>
          <p class="text-[11px] text-gray-400 mt-1.5">Leave blank to display as "Negotiable".</p>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label for="deadline" class="block text-sm font-semibold text-gray-900">Application Deadline</label>
            <span *ngIf="deadline" class="text-xs text-[#5046e5] font-medium bg-indigo-50 px-2 py-0.5 rounded-md">Selected: {{ deadline }}</span>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 text-base">
              📅
            </div>
            <input type="date" id="deadline" name="deadline" [min]="minDeadlineDate" [(ngModel)]="deadline" class="w-full pl-10 pr-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all cursor-pointer">
          </div>
          <!-- Quick Deadline Chips -->
          <div class="flex items-center gap-1.5 mt-2 flex-wrap">
            <span class="text-[11px] text-gray-400 font-medium mr-1">Quick pick:</span>
            <button type="button" (click)="setQuickDeadline(7)" class="text-[11px] font-medium px-2 py-1 rounded-md bg-gray-100 hover:bg-indigo-50 hover:text-[#5046e5] text-gray-600 transition">+7 Days</button>
            <button type="button" (click)="setQuickDeadline(14)" class="text-[11px] font-medium px-2 py-1 rounded-md bg-gray-100 hover:bg-indigo-50 hover:text-[#5046e5] text-gray-600 transition">+14 Days</button>
            <button type="button" (click)="setQuickDeadline(30)" class="text-[11px] font-medium px-2 py-1 rounded-md bg-gray-100 hover:bg-indigo-50 hover:text-[#5046e5] text-gray-600 transition">+30 Days</button>
            <button type="button" *ngIf="deadline" (click)="clearDeadline()" class="text-[11px] font-medium px-2 py-1 rounded-md bg-red-50 hover:bg-red-100 text-red-600 transition">✕ Clear</button>
          </div>
        </div>
      </div>

      <!-- JOB DESCRIPTION -->
      <div>
        <label for="description" class="block text-sm font-semibold text-gray-900 mb-2">Job Description *</label>
        <textarea id="description" name="description" [(ngModel)]="description" required rows="5" placeholder="Describe the role, responsibilities, and requirements..." class="w-full px-4 py-3 bg-[#f8fafc] border border-gray-200 rounded-xl text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#5046e5] focus:bg-white transition-all resize-none"></textarea>
      </div>

      <!-- MESSAGE ALERTS -->
      <div *ngIf="message">
        <p class="text-sm font-medium text-center p-3 rounded-lg mt-2" [ngClass]="isSuccess ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'">
          {{ message }}
        </p>
      </div>

      <!-- SUBMIT BUTTON -->
      <div class="pt-4 flex justify-end">
        <button type="submit" class="bg-[#5046e5] text-white font-medium px-8 py-3.5 rounded-xl hover:bg-[#4338ca] transition-colors shadow-sm">
          Post Job
        </button>
      </div>
      
    </form>
  </div>
</div>
